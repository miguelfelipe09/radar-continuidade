server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;

    # O roteamento é por hash, então tudo cai no index.html mesmo. O
    # try_files cobre o caso de alguém pedir um caminho direto.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos do build têm hash no nome, então podem ser cacheados longe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
