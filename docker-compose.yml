services:
  db:
    image: postgres:16-alpine
    # 5433 é disputada com o PostgreSQL nativo da máquina, que atende primeiro
    # em localhost e recusa as credenciais do container.
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: continuidade
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d continuidade"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplica as migrations pendentes e encerra. Usa a imagem do Postgres só pelo
  # psql; o script é sh puro, então nada disso depende do shell do host.
  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: continuidade
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    ports:
      - "3001:3001"
    environment:
      # Dentro da rede do compose o banco atende na 5432, não na 5434
      # publicada no host.
      DATABASE_URL: postgresql://app:app@db:5432/continuidade
      PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # O navegador do usuário fala com a API pelo host, não pela rede
        # interna do compose.
        VITE_API_URL: http://localhost:3001
    ports:
      - "4173:4173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
