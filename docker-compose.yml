services:
  db:
    image: postgres:16-alpine
    # 5433 é disputada com o PostgreSQL nativo da máquina, que atende primeiro
    # em localhost e recusa as credenciais do container.
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: continuidade
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d continuidade"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
